name: format
# Checks the formatting of every push and pull request, Markdown included. The deploy workflow
# skips Markdown-only changes, so this is the only check that sees them.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
