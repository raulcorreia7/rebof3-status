name: verify
on:
  push:
    branches: [main]
    paths-ignore: [progress.json] # a progress publish has no code to check
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The runner image usually ships DejaVu Sans; install it only when it is missing.
      - name: Provide DejaVu Sans for the picture
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build the page and the pictures
        run: npm run build
      - name: Test the model and the built site
        run: npm test
