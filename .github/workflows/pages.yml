name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A progress publish only rewrites progress.json; only a code change can break the
      # type check, so the run decides once and skips that step. Anything we cannot diff
      # (a dispatch, a new or rewritten branch) counts as a code change.
      - name: Decide what changed
        id: changes
        shell: bash
        run: |
          before='${{ github.event.before }}'
          code=true
          if [ '${{ github.event_name }}' = push ] &&
             [ -n "$before" ] &&
             [ "$before" != 0000000000000000000000000000000000000000 ] &&
             git cat-file -e "$before^{commit}" 2>/dev/null; then
            if [ -z "$(git diff --name-only "$before" '${{ github.event.after }}' -- . ':(exclude)progress.json')" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "code changed: type check, build, test"
          else
            echo "only progress.json changed: build and test"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The runner image usually ships DejaVu Sans; install it only when it is missing.
      - name: Provide DejaVu Sans for the picture
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
      - name: Build the page and the pictures
        run: npm run build
      - name: Test the model and the built site
        run: npm test
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
