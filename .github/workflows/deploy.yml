name: deploy
# Builds the page from the committed data/report.json and publishes it. A push to main rebuilds
# and deploys; a pull request only runs the checks.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: dprint/check@v2
        with:
          cache: true
      - name: Type check
        run: npm run lint
      - name: Check dependency licences
        run: npm run licenses
      # The build copies data/report.json into site/ and renders the pictures from it.
      - name: Build the page and the pictures
        run: npm run build
      - name: Test the model and the built site
        run: npm test
      - name: Check the site names only public projects
        run: |
          if grep -rEIl 'rebof3-simple|bof3-monorepo|public-prep' site data/report.json; then
            echo "::error::The site names a repository that is not public yet; remove it."
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
