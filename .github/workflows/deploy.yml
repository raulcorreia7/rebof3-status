name: deploy
# Builds the page from the committed data/report.json and publishes it. A push to main rebuilds
# and deploys; a pull request only runs the checks. Every pull request runs `build`, because the
# main ruleset requires it. A pull request that changes only docs runs the format check: the
# `changes` step gates the install, build and test steps, and `build` still reports.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Lists the files of this pull request (the checkout is the merge commit). Only docs: code=false.
      - id: changes
        name: Changes
        shell: bash
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD) || files=unknown
            code=false
            if printf '%s\n' "$files" | grep -qvE '^(.*\.md|docs/.*|LICENSE[^/]*|NOTICE|\.github/ISSUE_TEMPLATE/.*)$'; then code=true; fi
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then code=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changes.outputs.code == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          cache: true
      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
      - name: Check dependency licences
        if: steps.changes.outputs.code == 'true'
        run: npm run licenses
      # The build copies data/report.json into site/ and renders the pictures from it.
      - name: Build the page and the pictures
        if: steps.changes.outputs.code == 'true'
        run: npm run build
      - name: Test the model and the built site
        if: steps.changes.outputs.code == 'true'
        run: npm test
      - name: Check the site names only public projects
        if: steps.changes.outputs.code == 'true'
        run: |
          bad=$(grep -rhoE 'github\.com/raulcorreia7/[A-Za-z0-9._-]+' site data/report.json \
            | sed -E 's#^github\.com/raulcorreia7/##' | sort -u \
            | grep -vE '^(bof3-status|bof3-player)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These repositories are not public yet; remove them from the site:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
