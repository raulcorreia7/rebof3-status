name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach game data, disc images or extracted assets.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks. Add the relevant output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The browser and its version, or the commit when you build the site.
    validations:
      required: true
